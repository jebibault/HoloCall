<script>var l=(navigator.languages||[navigator.language]).map(function(x){return x.toLowerCase()});var a=['en', 'fr', 'de', 'es', 'it', 'pt-BR', 'nl', 'ja', 'ko', 'zh-Hans', 'ru'];var p='en';
